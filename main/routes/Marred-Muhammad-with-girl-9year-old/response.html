<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>چت با ملحد</title>
    <link rel="stylesheet" href="../../chats/chat.css">
</head>
<body>
    <div class="chat-container" id="chat"></div>
    <audio id="sendSound" src="../../chats/public/get.wav" controls style="display:none;"></audio>
    <audio id="receiveSound" src="../../chats/public/send.mp3" controls style="display:none;"></audio>
    <script src="../../chats/chat.js"></script>
    <script>
const messagesProject1 = [
    { sender: "other", text: "چرا پیامبر اسلام که پیامبره شما مدعی هستید که پیامبره", readTime: 2500 },
    { sender: "other", text: "چرا میاد توی سن ۵۵ سالگی با یک دختر بچه ۹ ساله ازدواج میکنه", readTime: 3500 },
    { sender: "other", text: "خب اون پیامبره، چرا پیامبر باید همچین کاری بکنه؟", readTime: 3500 },
    { sender: "me", text: "ببین، داریم راجع به ۱۴۰۰ سال پیش حرف می‌زنیم. زندگی و فرهنگ مردم اون موقع با امروز زمین تا آسمون فرق داشت.", readTime: 3000 },
    { sender: "other", text: "ولی ۹ سال که خیلی کمه! کسی که جای نوه‌ش حساب میشه چرا باهاش ازدواج میکنه؟", readTime: 4000 },
    { sender: "me", text: "اون موقع دخترها مثل نوجوان‌های الان حساب می‌شدن، نه مثل بچه‌های امروزی. حتی قبل از پیامبر هم عایشه نامزد یه نفر دیگه بوده.", readTime: 4000 },
    { sender: "other", text: "خب یعنی باز هم اشتباه نیست؟", readTime: 3000 },
    { sender: "me", text: "اتفاقاً مثال‌هایی هست. مثلاً ریچارد دوم انگلیس وقتی ۷۰ ساله بود با الیزابتا ۷ ساله ازدواج کرد! این‌ها هم تاریخیه و قانونی بوده تو زمان خودش.", readTime: 6000 },
    { sender: "me", text: "آره اتفاقاً! هم اروپا، هم آسیا، هم آفریقا. اون موقع سن بلوغ خیلی پایین بود. حتی تو اروپا دخترهای ۷ تا ۱۰ ساله عقد می‌شدن. اون موقع اصلاً عجیب نبود.", readTime: 6000 },
    { sender: "other", text: "جدی؟ یعنی فقط مخصوص جهان اسلام نبوده؟", readTime: 3000 },
    { sender: "me", text: "نه بابا، کاملاً یه چیز جهانی و فرهنگی بوده. تو خیلی جاها اختلاف سنی خیلی بیشتر هم بوده. مردم اون موقع این چیزها رو عادی می‌دونستن.", readTime: 5000 },
    { sender: "me", text: "درسته، امروز سنش خیلی کمه، ولی عایشه بعداً پنجاه سال زندگی کرد، فعال و محترم بود و هیچ نارضایتی ثبت نشده.", readTime: 5000 },
    { sender: "other", text: "ولی اخلاقاً هنوز سوال داره...", readTime: 2500 },
    { sender: "me", text: "درسته، ولی نمی‌شه شرایط ۱۴۰۰ سال پیش رو با امروز سنجید. مامان‌بزرگ‌های ما هم سن کمی ازدواج می‌کردن و اگه خودشون اعتراض نکردن، چرا ما باید اعتراض کنیم؟", readTime: 7000 },
    { sender: "other", text: "خب ولی پیامبر که باید بهترین نمونه اخلاقی باشه، پس چرا این کارو کرد؟", readTime: 3500 },
    { sender: "me", text: "منابع می‌گن ازدواج کاملاً قانونی و پذیرفته شده بوده و هیچ کس هم اعتراض نکرده.", readTime: 6000 },
    { sender: "other", text: "ولی آیا عایشه خودش راضی بود؟", readTime: 3000 },
    { sender: "me", text: "آره، بعد از پیامبر پنجاه سال زندگی سالم و موفق داشتن و کاملاً خوشبخت بودن.", readTime: 4000 },
    { sender: "other", text: "خب بخاطر اینکه اون پیامبر بوده جرأت نمی‌کردن با این ازدواج مخالفت کنن، نه؟", readTime: 3000 },
    { sender: "me", text: "نه، اصلاً بحث جرأت نیست. هیچ اعتراضی از خانواده، جامعه یا حتی دشمنان ثبت نشده. منابع معتبر همه می‌گن ازدواج پذیرفته شده بوده.", readTime: 5000 },
    { sender: "other", text: "پس اصل ماجرا اینه که تاریخ و فرهنگ زمان خودش رو باید درک کنیم نه با معیار امروز", readTime: 3000 },
    { sender: "me", text: "آره، دقیقاً. هدف اینه که تاریخ رو با انصاف نگاه کنیم، نه کورکورانه قضاوت کنیم.", readTime: 3000 },
    { sender: "other", text: "نمیتونم باور کنم هنوز", readTime: 3000 },
    { sender: "me", text: "طبیعیه، زمان می‌بره. فقط یه نکته: زندگی عایشه نشون میده اون ازدواج کاملاً پذیرفته و خوشبخت بوده.", readTime: 4000 },
    { sender: "other", text: "و دشمنان پیامبر چرا هیچ اعتراضی نکردن؟", readTime: 3000 },
    { sender: "me", text: "چون اون زمان کاملاً پذیرفته بود و هیچ دلیل قانونی یا اخلاقی برای اعتراض وجود نداشت.", readTime: 4000 },
    { sender: "other", text: "پس واقعاً هیچ ظلمی صورت نگرفته؟", readTime: 3000 },
    { sender: "me", text: "در چارچوب زمان خودش خیر. زندگی بعدشون هم نشون میده خوشبخت و محترم بودن.", readTime: 4000 },
    { sender: "other", text: "می‌فهمم... پس تاریخ و فرهنگ زمان خودش معیار اصلیه", readTime: 3000 },
    { sender: "me", text: "آره، وقتی حال‌و‌هوای اون زمان رو درک کنی، قضاوت کردن خیلی منصفانه‌تر می‌شه.", readTime: 3000 },
    { sender: "me", text: `
        و پیام آخر اینکه:
        قضاوت تاریخ با معیار امروز نیازمند دقت علمی و انصاف اخلاقی است. هدف این بحث، فهم بهتر شرایط اجتماعی، فرهنگی و تاریخی آن دوران است، نه توجیه کورکورانهٔ گذشته.

        یه نکته مهم: این‌طور نیست که چون بعضی رفتارها یا قوانین در زمان خودشون معنا داشتن، کل اسلام زمان‌مند باشه یا امروز قابل اجرا نباشه. فقط یه بخش خیلی کوچک از احکام وابسته به شرایط تاریخی بوده؛ اما بخش عمدهٔ معارف و قوانین اسلام همیشه قابل اجرا و انسانی و پایدار باقی موندن.

        تاریخ اسلام و زندگی پیامبر، با بررسی منابع معتبر، نشان می‌دهد بسیاری از اعمال و تصمیمات در چارچوب اجتماعی، فرهنگی و قانونی زمان خود قابل فهم هستند.
        زندگی عایشه بعد از پیامبر هم نشون می‌ده آن ازدواج کاملاً رضایت‌بخش و خوشبختانه بوده.
        امروز ما وظیفه داریم با نگاه تحلیلی و انسانی، جامعه خودمون رو بهتر کنیم و گذشته را صرفاً محکوم نکنیم. تمرکز بر درک درست تاریخ، آموزش نسل‌های بعد و جلوگیری از سوءبرداشت‌ها، بهترین مسیر است.
    `, readTime: 14000 }
];

initChat(messagesProject1);
    </script>
</body>
</html>
